name: Terraform plan

on:
  pull_request:
    branches:
      - main
    paths:
      - infra/envs/**

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.detect-changes.outputs.json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect-changes
        run: |
          changed_files=$(git diff --name-only origin/main...HEAD -- 'infra/envs/**')
          direct_roots=()

          for file in $changed_files; do
            if [[ "$file" == infra/envs/* ]]; then
              dir=$(dirname "$file")
              
              while [[ "$dir" != "infra/envs" && ! -f "$dir/backend.tf" ]]; do
                dir=$(dirname "$dir")
              done
              
              if [[ -f "$dir/backend.tf" ]]; then
                direct_roots+=("$dir")
              fi
            fi
          done

          direct_roots=($(printf "%s\n" "${direct_roots[@]}" | sort -u))

          echo "${direct_roots[@]}"

          json=$(printf '%s\n' "${direct_roots[@]}" | jq -R -s -c 'split("\n")[:-1]')

          echo "json=$json" >> "$GITHUB_OUTPUT"

  plan:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.json != '[]'
    strategy:
      matrix: 
        dir: ${{ fromJson(needs.detect-changes.outputs.json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
      
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Initialize terraform
        id: init
        run: terraform init -no-color
        working-directory: ${{ matrix.dir }}

      - name: Validate terraform
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

      - name: Generate plan
        id: plan
        continue-on-error: false
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ matrix.dir }}
        
      - name: Comment plan to PR
        uses: actions/github-script@v9
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const dir = '${{ matrix.dir }}';
            const module = dir.replace(/^infra\/envs\//, '');
            
            const plan = process.env.PLAN || '';
            const planTruncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;

            const body = [
              '### Terraform Plan for ' + module,
              '```',
              planTruncated,
              '```',
              '*Plan exit code: ${{ steps.plan.outputs.exitcode }}*'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
